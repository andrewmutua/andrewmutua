<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#052e1a"/>
      <stop offset="50%" stop-color="#064e2c"/>
      <stop offset="100%" stop-color="#052e1a"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Radar arcs (decorative) -->
  <g opacity="0.18" stroke="#4ade80" fill="none" stroke-width="1">
    <circle cx="1050" cy="80" r="60"/>
    <circle cx="1050" cy="80" r="110"/>
    <circle cx="1050" cy="80" r="160"/>
    <circle cx="1050" cy="80" r="210"/>
    <line x1="1050" y1="80" x2="1250" y2="80"/>
    <line x1="1050" y1="80" x2="1050" y2="290"/>
    <line x1="1050" y1="80" x2="1210" y2="240"/>
    <line x1="1050" y1="80" x2="890" y2="240"/>
  </g>

  <!-- Name -->
  <text x="60" y="130" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="72" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">
    Andrew Mutua
  </text>

  <!-- Role -->
  <text x="62" y="180" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="22" font-weight="500" fill="#d1fae5" opacity="0.95">
    Software Engineer · Web Designer · Based in Kenya
  </text>

  <!-- Tagline -->
  <text x="62" y="215" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="15" font-weight="400" fill="#86efac" opacity="0.8">
    Building clean, fast and user-focused digital experiences.
  </text>

  <!-- Animated line -->
  <line x1="60" y1="250" x2="1140" y2="250" stroke="#4ade80" stroke-width="2"
        stroke-opacity="0.35" stroke-dasharray="4 4"/>

  <!-- Animated dot travelling back and forth -->
  <circle r="7" fill="#4ade80" filter="url(#dotGlow)">
    <animate attributeName="cx" values="60;1140;60" dur="6s" repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"
             keyTimes="0; 0.5; 1"/>
    <animate attributeName="cy" values="250;250;250" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Small trailing dots for effect -->
  <circle r="3" fill="#4ade80" opacity="0.5">
    <animate attributeName="cx" values="60;1140;60" dur="6s" begin="0.1s" repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"
             keyTimes="0; 0.5; 1"/>
    <animate attributeName="cy" values="250;250;250" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle r="2" fill="#22c55e" opacity="0.35">
    <animate attributeName="cx" values="60;1140;60" dur="6s" begin="0.2s" repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"
             keyTimes="0; 0.5; 1"/>
    <animate attributeName="cy" values="250;250;250" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
