<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <!-- Deep indigo/emerald background gradient -->
    <linearGradient id="eduBg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="50%" stop-color="#0c1e2e"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </linearGradient>

    <!-- Radial spotlight behind the card -->
    <radialGradient id="spot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Title gradient (emerald → cyan) -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Card border gradient (glass edge) -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Card fill -->
    <linearGradient id="cardFill" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1a2c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1523" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow filter for the cap -->
    <filter id="capGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft outer glow for the card -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#eduBg)"/>

  <!-- Spotlight behind card -->
  <ellipse cx="600" cy="160" rx="520" ry="140" fill="url(#spot)"/>

  <!-- Floating dot particles (static, no animation) -->
  <g fill="#34d399" opacity="0.35">
    <circle cx="120" cy="60" r="2"/>
    <circle cx="220" cy="250" r="1.5"/>
    <circle cx="320" cy="90" r="1.8"/>
    <circle cx="900" cy="70" r="2"/>
    <circle cx="1010" cy="240" r="1.6"/>
    <circle cx="1100" cy="120" r="1.8"/>
    <circle cx="150" cy="180" r="1.4"/>
    <circle cx="1050" cy="180" r="1.6"/>
  </g>

  <!-- ==================== GLASS CARD ==================== -->
  <g filter="url(#cardGlow)">
    <rect x="100" y="50" width="1000" height="220" rx="24"
          fill="url(#cardFill)" stroke="url(#cardBorder)" stroke-width="1.5"/>
  </g>

  <!-- Top accent line on the card -->
  <rect x="100" y="50" width="1000" height="3" rx="1.5" fill="url(#cardBorder)"/>

  <!-- ==================== GRADUATION CAP ==================== -->
  <g transform="translate(160, 130)" filter="url(#capGlow)">
    <!-- Cap top (diamond) -->
    <path d="M0 20 L50 0 L100 20 L50 40 Z"
          fill="#34d399" opacity="0.95"/>
    <!-- Cap base -->
    <path d="M25 30 L25 58 Q50 72 75 58 L75 30"
          fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tassel -->
    <line x1="100" y1="20" x2="100" y2="52" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="100" cy="56" r="4" fill="#22d3ee"/>
    <!-- Subtle pulse on the tassel dot -->
    <circle cx="100" cy="56" r="4" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="4;10;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== TEXT ==================== -->
  <!-- Small label -->
  <text x="300" y="105" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="13" font-weight="700" fill="#22d3ee" letter-spacing="3">
    EDUCATION
  </text>

  <!-- University -->
  <text x="300" y="145" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="30" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.4">
    Technical University of Mombasa
  </text>

  <!-- Acronym subtitle -->
  <text x="300" y="178" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="16" font-weight="600" fill="#a7f3d0" opacity="0.9">
    TUM · Mombasa, Kenya
  </text>

  <!-- Degree + year -->
  <text x="300" y="215" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="17" font-weight="500" fill="#d1fae5">
    Bachelor of Science in Information Technology
  </text>

  <!-- Status pill (drawn as rounded rect + text) -->
  <g transform="translate(300, 235)">
    <rect x="0" y="0" width="230" height="26" rx="13"
          fill="#34d399" fill-opacity="0.12"
          stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="13" font-weight="600" fill="#a7f3d0">
      Year 3 · Currently studying
    </text>
  </g>

  <!-- Corner accents (subtle circuit hints) -->
  <g opacity="0.18" stroke="#22d3ee" stroke-width="1.5" fill="none">
    <path d="M1080 90 L1120 90 L1120 130"/>
    <circle cx="1120" cy="130" r="3" fill="#22d3ee"/>
    <path d="M1080 220 L1120 220 L1120 180"/>
    <circle cx="1120" cy="180" r="3" fill="#22d3ee"/>
  </g>
</svg>
